<div class="sidebar">
  <div class="sidebar__search">
    <app-search></app-search>
  </div>
  <div class="sidebar__block-menu">
    <div class="sidebar__search"></div>
    <h3 class="sidebar__title">Жанр</h3>
    <div  class="genre">
      @for(genre of genres; track genre) {
        <app-custom-radio
          [value]="genre.id"
          [(ngModel)]="selectedOption"

          [label]="genre.label"></app-custom-radio>
      }
    </div>
  </div>

</div>
